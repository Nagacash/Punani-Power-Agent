name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Matrix jobs are named "test (20)", "test (22)", … on GitHub, so branch
  # protection that requires a check literally named "test" needs this umbrella job.
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  test:
    runs-on: ubuntu-latest
    needs: [test-matrix]
    steps:
      - run: echo "matrix passed"
